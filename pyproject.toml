[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tgtp"
version = "0.1.0"
description = "Text-Guided Visual Token Pruning for Efficient Multimodal Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1",
    "transformers>=4.44",
    "accelerate>=0.30",
    "datasets>=2.19",
    "evaluate>=0.4",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "tqdm>=4.66",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]
colab = ["gdown"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

