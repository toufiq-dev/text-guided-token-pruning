# Experiment: random pruning baseline (mandatory in ALL experiments)
# Empirical finding: random 50% pruning of visual tokens still yields correct
# answers on SmolVLM-Instruct. This baseline must be beaten by text-guided pruning.
experiment:
  name: "baseline_random_pruning"
  model: "configs/models/smolvlm_instruct.yaml"
  datasets: ["configs/datasets/vqav2.yaml", "configs/datasets/gqa.yaml", "configs/datasets/textvqa.yaml"]

pruning:
  enabled: true
  target_keep_ratio: 0.5
  scoring_method: "random"
  merge_strategy: "drop"
  pruning_location: "pre_decoder"

baseline:
  random_pruning: true
  full_tokens: true

evaluation:
  metrics: ["vqa_accuracy", "exact_match", "flops_estimate", "latency_ms"]
  seeds: [0, 1, 2, 3, 4]
  max_samples_per_benchmark: 500
