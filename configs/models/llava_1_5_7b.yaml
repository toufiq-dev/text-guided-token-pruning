# LLaVA-1.5-7B model config (secondary model for cross-architecture validation)
model:
  name: "llava-hf/llava-1.5-7b-hf"
  type: "LlavaForConditionalGeneration"
  vision_encoder: "CLIP ViT-L/14 @ 336px"
  # Verified: 24x24 = 576 visual tokens at 336x336; Vicuna-7B decoder with 32 layers
  num_visual_tokens: 576
  vision_hidden_dim: 1024
  llm_hidden_dim: 4096
  llm_layers: 32
  torch_dtype: "float16"
  processor_name: "llava-hf/llava-1.5-7b-hf"

  # LLaVA-1.5 extraction points (pre-decoder, before the LLM):
  #   vision tower  -> model.vision_tower
  #   projector     -> model.multi_modal_projector
  #   language model-> model.language_model
  # The SmolVLMPruningWrapper is Idefics3-specific; use a thin adapter for LLaVA
  # (see scripts/05_run_ablations.py) that mirrors the same pre-decoder contract.
  vision_model_path: "model.vision_tower.vision_model"
  connector_path: "model.multi_modal_projector"
  text_model_path: "model.language_model"

pruning:
  target_keep_ratio: 0.5
  scoring_method: "cross_attention"
  merge_strategy: "drop"
  pruning_location: "pre_decoder"

baseline:
  random_pruning: true
  full_tokens: true
